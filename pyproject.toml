[project]
name = "library-management-api"
version = "0.1.0"
description = "Library Management System API with PostgreSQL persistence"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.15.0",
    "pydantic[email]>=2.9.2",
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.1.0",
    "pydantic-settings>=2.0.0",
]

[tool.uv]
managed = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "mockito>=1.5.4",
    "openapi-spec-validator>=0.9.0",
    "pytest>=9.1.1",
    "schemathesis>=4.24.3",
    "testcontainers[postgres]>=4.15.0",
]
